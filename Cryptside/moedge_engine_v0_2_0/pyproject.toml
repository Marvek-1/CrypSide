[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moedge-engine"
version = "0.2.0"
description = "Portable regime-aware crypto signal/risk scoring engine"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pandas>=2.0.0",
  "pyyaml>=6.0.0",
]

[project.optional-dependencies]
live = ["ccxt>=4.0.0"]
dev = ["pytest>=7.0.0", "ccxt>=4.0.0"]

[project.scripts]
moedge = "moedge.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["moedge*"]
